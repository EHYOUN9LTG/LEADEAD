<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LEADEAD</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 24px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    header p {
      margin: 8px 0 0;
      color: #bbb;
    }

    main {
      max-width: 700px;
      margin: 0 auto;
      padding: 20px;
    }

    .welcome {
      background: white;
      border-radius: 18px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .welcome h2 {
      margin-top: 0;
    }

    .empty {
      text-align: center;
      padding: 45px 20px;
      background: white;
      border-radius: 18px;
      color: #777;
    }

    .empty-icon {
      font-size: 50px;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>

  <header>
    <h1>LEADEAD</h1>
    <p>사진과 이야기를 함께 기록하는 공간</p>
  </header>

  <main>

    <section class="welcome">
      <h2>👋 환영합니다</h2>
      <p>
        이곳에 사진과 글이 올라옵니다.
      </p>
    </section>

    <section class="empty">
      <div class="empty-icon">📷</div>
      <h2>아직 게시물이 없습니다</h2>
      <p>첫 번째 사진과 이야기를 기다리고 있어요.</p>
    </section>

  </main>

</body>
</html>
