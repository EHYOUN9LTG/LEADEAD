<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LEADEAD</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #111;
    }

    /* ==============================
       랜덤 배경
       ============================== */

    #backgroundPhoto {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    #backgroundPhoto img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 0.16;
    }

    header,
    main {
      position: relative;
      z-index: 1;
    }

    /* ==============================
       헤더
       ============================== */

    header {
      background: rgba(255, 255, 255, 0.94);
      color: #111;
      padding: 28px 20px;
      text-align: center;
      border-bottom: 1px solid #eeeeee;
      backdrop-filter: blur(8px);
    }

    header h1 {
      margin: 0;
      font-size: 32px;
      letter-spacing: 3px;
    }

    header p {
      margin: 10px 0 0;
      color: #666;
    }

    /* ==============================
       메인
       ============================== */

    main {
      max-width: 700px;
      margin: 25px auto;
      padding: 0 16px;
    }

    .card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      backdrop-filter: blur(6px);
    }

    /* ==============================
       환영
       ============================== */

    .welcome {
      text-align: center;
    }

    .welcome h2 {
      margin-top: 0;
    }

    /* ==============================
       업로드
       ============================== */

    .upload-box h2 {
      margin-top: 0;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px;
      margin-top: 8px;
      border: 1px solid #dddddd;
      border-radius: 11px;
      background: #fafafa;
      color: #111;
      font-size: 15px;
      outline: none;
    }

    input:focus,
    textarea:focus {
      border-color: #888;
      background: white;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    input[type="file"] {
      background: white;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border: none;
      border-radius: 11px;
      background: #111;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    .preview {
      width: 100%;
      max-height: 300px;
      object-fit: cover;
      border-radius: 12px;
      margin-top: 12px;
      display: none;
    }

    .status {
      margin-top: 10px;
      padding: 10px;
      border-radius: 10px;
      background: #f5f5f5;
      color: #555;
      font-size: 14px;
      word-break: break-word;
    }

    /* ==============================
       게시물
       ============================== */

    #posts {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .post {
      background: rgba(255, 255, 255, 0.96);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      backdrop-filter: blur(5px);
    }

    .post img {
      width: 100%;
      max-height: 500px;
      object-fit: cover;
      display: block;
    }

    .post-content {
      padding: 18px;
    }

    .author {
      font-size: 13px;
      color: #777;
      margin-bottom: 8px;
    }

    .post h3 {
      margin: 0 0 10px;
      font-size: 21px;
    }

    .post p {
      margin: 0;
      white-space: pre-wrap;
      line-height: 1.6;
    }

    .date {
      margin-top: 14px;
      color: #999;
      font-size: 12px;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 30px 10px;
    }

    .error {
      color: #d00;
      text-align: center;
      padding: 20px;
    }

    @media (max-width: 600px) {

      header h1 {
        font-size: 28px;
      }

      main {
        padding: 0 12px;
      }

      #backgroundPhoto img {
        opacity: 0.12;
      }

    }
  </style>
</head>

<body>

  <!-- 랜덤 배경 -->
  <div id="backgroundPhoto">
    <img id="randomBackground" alt="">
  </div>


  <header>
    <h1>LEADEAD</h1>
    <p>사진과 이야기를 함께 기록하는 공간</p>
  </header>


  <main>

    <!-- 환영 -->
    <section class="card welcome">

      <h2>👋 환영합니다</h2>

      <p>
        LEADEAD에 기록된 사진과 이야기를 만나보세요.
      </p>

    </section>


    <!-- 게시물 업로드 -->
    <section class="card upload-box">

      <h2>📷 게시물 올리기</h2>

      <input
        id="authorName"
        type="text"
        placeholder="이름"
        maxlength="30"
      >

      <input
        id="title"
        type="text"
        placeholder="제목"
        maxlength="100"
      >

      <textarea
        id="content"
        placeholder="내용을 입력하세요."
      ></textarea>

      <input
        id="image"
        type="file"
        accept="image/*"
        onchange="previewImage()"
      >

      <img
        id="imagePreview"
        class="preview"
        alt="사진 미리보기"
      >

      <button onclick="uploadPost()">
        게시물 올리기
      </button>

      <div
        id="uploadStatus"
        class="status"
        style="display:none;"
      ></div>

    </section>


    <!-- 게시물 -->
    <section id="posts">

      <div class="card empty">
        게시물을 불러오는 중...
      </div>

    </section>

  </main>


  <script>

    // ==========================================
    // Supabase
    // ==========================================

    const SUPABASE_URL =
      "https://njmohfznypdcazdhbuul.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_tcRopRjkw1iAPO0r5ty86Q_YZGo-VXq";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    // ==========================================
    // 랜덤 배경
    // ==========================================

    const backgroundGroups = {

      stellive: [
        "KANNA.webp",
        "HEBI.webp",
        "HUYA.webp",
        "LIZE.webp",
        "TABI.webp",
        "MASHIRO.webp",
        "HINA.webp",
        "BUKI.webp",
        "LIN.webp",
        "NANA.webp",
        "RIKO.webp",
        "YUNI.jpeg"
      ],

      isegye: [
        "GOSEGU.webp",
        "JURURU.webp",
        "VICHAN.webp",
        "INE.webp",
        "JINGBURGUR.webp",
        "LILPA.webp",
        "ISEGYE IDOL.png"
      ],

      lotte: [
        "LOTTE.jpeg",
        "LOTTE1.jpeg",
        "LOTTE2.jpeg"
      ]

    };


    function setRandomBackground() {

      const groups =
        Object.values(backgroundGroups);

      const selectedGroup =
        groups[
          Math.floor(
            Math.random() * groups.length
          )
        ];

      const selectedImage =
        selectedGroup[
          Math.floor(
            Math.random() *
            selectedGroup.length
          )
        ];

      const imagePath =
        "assets/background/" +
        encodeURIComponent(selectedImage);

      document
        .getElementById("randomBackground")
        .src = imagePath;

    }


    setRandomBackground();


    // ==========================================
    // 이름 기억
    // ==========================================

    const savedName =
      localStorage.getItem(
        "leadead_author_name"
      );


    if (savedName) {

      document
        .getElementById("authorName")
        .value = savedName;

    }


    // ==========================================
    // 이미지 미리보기
    // ==========================================

    function previewImage() {

      const file =
        document
          .getElementById("image")
          .files[0];

      const preview =
        document
          .getElementById("imagePreview");


      if (!file) {

        preview.style.display = "none";

        return;

      }


      preview.src =
        URL.createObjectURL(file);

      preview.style.display =
        "block";

    }


    // ==========================================
    // 게시물 업로드
    // ==========================================

    async function uploadPost() {

      const authorName =
        document
          .getElementById("authorName")
          .value
          .trim();

      const title =
        document
          .getElementById("title")
          .value
          .trim();

      const content =
        document
          .getElementById("content")
          .value
          .trim();

      const file =
        document
          .getElementById("image")
          .files[0];

      const status =
        document
          .getElementById("uploadStatus");


      status.style.display =
        "block";


      // 이름 확인
      if (!authorName) {

        status.textContent =
          "❌ 이름을 입력해줘.";

        return;

      }


      // 이름 기억
      localStorage.setItem(
        "leadead_author_name",
        authorName
      );


      // 제목 확인
      if (!title) {

        status.textContent =
          "❌ 제목을 입력해줘.";

        return;

      }


      // 내용 확인
      if (!content) {

        status.textContent =
          "❌ 내용을 입력해줘.";

        return;

      }


      // 사진 확인
      if (!file) {

        status.textContent =
          "❌ 사진을 선택해줘.";

        return;

      }


      status.textContent =
        "📤 업로드 중...";


      // ========================================
      // 이미지 업로드
      // ========================================

      const extension =
        file.name
          .split(".")
          .pop()
          .toLowerCase();


      const fileName =
        Date.now() +
        "-" +
        Math.random()
          .toString(36)
          .substring(2) +
        "." +
        extension;


      const filePath =
        "posts/" + fileName;


      const {
        error: uploadError
      } =
        await supabaseClient
          .storage
          .from("images")
          .upload(
            filePath,
            file
          );


      if (uploadError) {

        console.error(uploadError);

        status.textContent =
          "❌ 사진 업로드 실패: " +
          uploadError.message;

        return;

      }


      // ========================================
      // 사진 URL
      // ========================================

      const {
        data: publicData
      } =
        supabaseClient
          .storage
          .from("images")
          .getPublicUrl(filePath);


      const imageUrl =
        publicData.publicUrl;


      // ========================================
      // 게시물 DB 저장
      // ========================================

      const {
        error: insertError
      } =
        await supabaseClient
          .from("posts")
          .insert({

            author_name: authorName,
            title: title,
            content: content,
            image_url: imageUrl

          });


      if (insertError) {

        console.error(insertError);

        status.textContent =
          "❌ 게시물 저장 실패: " +
          insertError.message;

        return;

      }


      // ========================================
      // 완료
      // ========================================

      status.textContent =
        "✅ 게시물이 올라갔어!";


      // 제목/내용/사진만 초기화
      document
        .getElementById("title")
        .value = "";

      document
        .getElementById("content")
        .value = "";

      document
        .getElementById("image")
        .value = "";

      document
        .getElementById("imagePreview")
        .style.display = "none";


      // 이름은 그대로 유지
      document
        .getElementById("authorName")
        .value = authorName;


      // 게시물 새로고침
      loadPosts();

    }


    // ==========================================
    // 게시물 불러오기
    // ==========================================

    async function loadPosts() {

      const postsContainer =
        document.getElementById("posts");


      const {
        data,
        error
      } =
        await supabaseClient
          .from("posts")
          .select("*")
          .order(
            "created_at",
            {
              ascending: false
            }
          );


      if (error) {

        console.error(error);

        postsContainer.innerHTML = `

          <div class="card error">
            게시물을 불러오지 못했습니다.
          </div>

        `;

        return;

      }


      if (!data || data.length === 0) {

        postsContainer.innerHTML = `

          <div class="card empty">
            📷 아직 게시물이 없습니다.
          </div>

        `;

        return;

      }


      postsContainer.innerHTML = "";


      data.forEach(post => {

        const article =
          document.createElement("article");


        article.className =
          "post";


        let imageHTML = "";


        if (post.image_url) {

          imageHTML = `

            <img
              src="${escapeHTML(post.image_url)}"
              alt="${escapeHTML(
                post.title || "게시물 이미지"
              )}"
            >

          `;

        }


        article.innerHTML = `

          ${imageHTML}

          <div class="post-content">

            <div class="author">
              👤 ${escapeHTML(
                post.author_name || "익명"
              )}
            </div>

            <h3>
              ${escapeHTML(
                post.title || "제목 없음"
              )}
            </h3>

            <p>
              ${escapeHTML(
                post.content || ""
              )}
            </p>

            <div class="date">
              ${formatDate(
                post.created_at
              )}
            </div>

          </div>

        `;


        postsContainer.appendChild(
          article
        );

      });

    }


    // ==========================================
    // 날짜
    // ==========================================

    function formatDate(date) {

      if (!date) return "";


      return new Date(date)
        .toLocaleString(
          "ko-KR",
          {
            year: "numeric",
            month: "long",
            day: "numeric",
            hour: "2-digit",
            minute: "2-digit"
          }
        );

    }


    // ==========================================
    // HTML 안전 처리
    // ==========================================

    function escapeHTML(text) {

      return String(text ?? "")
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    // ==========================================
    // 시작
    // ==========================================

    loadPosts();

  </script>

</body>
</html>
