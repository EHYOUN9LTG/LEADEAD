<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LEADEAD</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #111;
    }

    /* ==============================
       랜덤 배경 사진
       ============================== */

    #backgroundPhoto {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    #backgroundPhoto img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 0.18;
    }

    /* 실제 내용은 배경보다 위 */
    header,
    main {
      position: relative;
      z-index: 1;
    }

    header {
      background: rgba(255, 255, 255, 0.94);
      color: #111;
      padding: 28px 20px;
      text-align: center;
      border-bottom: 1px solid #eeeeee;
      backdrop-filter: blur(8px);
    }

    header h1 {
      margin: 0;
      font-size: 32px;
      letter-spacing: 3px;
    }

    header p {
      margin: 10px 0 0;
      color: #666;
    }

    main {
      max-width: 700px;
      margin: 25px auto;
      padding: 0 16px;
    }

    .card {
      background: rgba(255, 255, 255, 0.94);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      backdrop-filter: blur(6px);
    }

    .welcome {
      text-align: center;
    }

    .welcome h2 {
      margin-top: 0;
    }

    #posts {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .post {
      background: rgba(255, 255, 255, 0.96);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      backdrop-filter: blur(5px);
    }

    .post img {
      width: 100%;
      max-height: 500px;
      object-fit: cover;
      display: block;
    }

    .post-content {
      padding: 18px;
    }

    .post h3 {
      margin: 0 0 10px;
      font-size: 21px;
    }

    .post p {
      margin: 0;
      white-space: pre-wrap;
      line-height: 1.6;
    }

    .date {
      margin-top: 14px;
      color: #888;
      font-size: 12px;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 30px 10px;
    }

    .error {
      color: #d00;
      text-align: center;
      padding: 20px;
    }

    @media (max-width: 600px) {

      header h1 {
        font-size: 28px;
      }

      main {
        padding: 0 12px;
      }

      #backgroundPhoto img {
        object-fit: contain;
        opacity: 0.14;
      }

    }
  </style>
</head>

<body>

  <!-- ==============================
       랜덤 배경 사진
       ============================== -->

  <div id="backgroundPhoto">
    <img id="randomBackground" alt="">
  </div>


  <header>
    <h1>LEADEAD</h1>
    <p>사진과 이야기를 함께 기록하는 공간</p>
  </header>


  <main>

    <section class="card welcome">
      <h2>👋 환영합니다</h2>

      <p>
        LEADEAD에 기록된 사진과 이야기를 만나보세요.
      </p>
    </section>


    <section id="posts">

      <div class="card empty">
        게시물을 불러오는 중...
      </div>

    </section>

  </main>


  <script>

    // ==============================
    // 랜덤 배경 이미지
    // ==============================

    const backgroundGroups = {

      stellive: [
        "KANNA.webp",
        "HEBI.webp",
        "HUYA.webp",
        "LIZE.webp",
        "TABI.webp",
        "MASHIRO.webp",
        "HINA.webp",
        "BUKI.webp",
        "LIN.webp",
        "NANA.webp",
        "RIKO.webp",
        "YUNI.jpeg"
      ],

      isegye: [
        "GOSEGU.webp",
        "JURURU.webp",
        "VICHAN.webp",
        "INE.webp",
        "JINGBURGUR.webp",
        "LILPA.webp",
        "ISEGYE IDOL.png"
      ],

      lotte: [
        "LOTTE.jpeg",
        "LOTTE1.jpeg",
        "LOTTE2.jpeg"
      ]

    };


    function setRandomBackground() {

      const groups =
        Object.values(backgroundGroups);


      // 3개 그룹 중 하나 선택
      const selectedGroup =
        groups[
          Math.floor(
            Math.random() * groups.length
          )
        ];


      // 선택된 그룹에서 사진 하나 선택
      const selectedImage =
        selectedGroup[
          Math.floor(
            Math.random() *
            selectedGroup.length
          )
        ];


      const imagePath =
        "assets/background/" +
        encodeURIComponent(selectedImage);


      const background =
        document.getElementById(
          "randomBackground"
        );


      background.src = imagePath;


      console.log(
        "랜덤 배경:",
        selectedImage
      );

    }


    // 페이지 열 때 랜덤 사진
    setRandomBackground();


    // ==============================
    // Supabase 설정
    // ==============================

    const SUPABASE_URL =
      "https://njmohfznypdcazdhbuul.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_tcRopRjkw1iAPO0r5ty86Q_YZGo-VXq";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    // ==============================
    // 게시물 불러오기
    // ==============================

    async function loadPosts() {

      const postsContainer =
        document.getElementById("posts");


      const {
        data,
        error
      } =
        await supabaseClient
          .from("posts")
          .select("*")
          .order(
            "created_at",
            {
              ascending: false
            }
          );


      if (error) {

        console.error(error);

        postsContainer.innerHTML = `

          <div class="card error">
            게시물을 불러오지 못했습니다.
          </div>

        `;

        return;
      }


      // 게시물이 없는 경우

      if (!data || data.length === 0) {

        postsContainer.innerHTML = `

          <div class="card empty">
            📷 아직 게시물이 없습니다.
          </div>

        `;

        return;
      }


      // 게시물 표시

      postsContainer.innerHTML = "";


      data.forEach(post => {

        const article =
          document.createElement("article");


        article.className =
          "post";


        let imageHTML = "";


        if (post.image_url) {

          imageHTML = `

            <img
              src="${escapeHTML(post.image_url)}"
              alt="${escapeHTML(
                post.title || "게시물 이미지"
              )}"
            >

          `;

        }


        article.innerHTML = `

          ${imageHTML}

          <div class="post-content">

            <h3>
              ${escapeHTML(
                post.title || "제목 없음"
              )}
            </h3>

            <p>
              ${escapeHTML(
                post.content || ""
              )}
            </p>

            <div class="date">
              ${formatDate(
                post.created_at
              )}
            </div>

          </div>

        `;


        postsContainer.appendChild(
          article
        );

      });

    }


    // ==============================
    // 날짜 표시
    // ==============================

    function formatDate(date) {

      if (!date) return "";


      return new Date(date)
        .toLocaleString(
          "ko-KR",
          {
            year: "numeric",
            month: "long",
            day: "numeric",
            hour: "2-digit",
            minute: "2-digit"
          }
        );

    }


    // ==============================
    // HTML 문자 안전 처리
    // ==============================

    function escapeHTML(text) {

      return String(text)
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    // ==============================
    // 시작
    // ==============================

    loadPosts();

  </script>

</body>
</html>
