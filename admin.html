<!DOCTYPE html><html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>LEADEAD 관리자</title>  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #111111;
    }

    header {
      padding: 30px 20px;
      text-align: center;
      background: #ffffff;
      border-bottom: 1px solid #eeeeee;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
      letter-spacing: 2px;
    }

    header p {
      margin: 8px 0 0;
      color: #777777;
    }

    .container {
      width: 100%;
      max-width: 800px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      border: 1px solid #e5e5e5;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.06);
    }

    h2 {
      margin-top: 0;
      color: #111111;
    }

    input,
    textarea {
      width: 100%;
      padding: 14px;
      margin: 7px 0;
      border: 1px solid #dddddd;
      border-radius: 12px;
      background: #fafafa;
      color: #111111;
      font-size: 15px;
      outline: none;
    }

    textarea {
      min-height: 150px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 8px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    .login,
    .upload {
      background: #111111;
      color: white;
    }

    .refresh {
      background: #eeeeee;
      color: #111111;
      margin-bottom: 8px;
    }

    .edit {
      background: #eeeeee;
      color: #111111;
    }

    .save {
      background: #16a34a;
      color: white;
    }

    .cancel {
      background: #777777;
      color: white;
    }

    .delete {
      background: #dc2626;
      color: white;
    }

    .logout {
      background: #eeeeee;
      color: #111111;
    }

    .hidden {
      display: none;
    }

    .status {
      margin-top: 12px;
      padding: 10px;
      border-radius: 10px;
      background: #f5f5f5;
      color: #555555;
      word-break: break-word;
    }

    /* 게시물 */

    .post {
      background: #ffffff;
      border: 1px solid #e5e5e5;
      border-radius: 15px;
      padding: 14px;
      margin-top: 15px;
    }

    .post img {
      display: block;
      width: 100%;
      max-height: 350px;
      object-fit: cover;
      border-radius: 12px;
      background: #f5f5f5;
      margin-bottom: 14px;
    }

    .post-no-image {
      width: 100%;
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f5;
      border-radius: 12px;
      color: #999999;
      margin-bottom: 14px;
    }

    .post-author {
      font-size: 14px;
      color: #777777;
      margin-bottom: 6px;
    }

    .post-title {
      font-size: 21px;
      font-weight: bold;
      margin-bottom: 10px;
      word-break: break-word;
    }

    .post-content {
      font-size: 16px;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: anywhere;
      color: #333333;
      margin-bottom: 12px;
    }

    .post-date {
      font-size: 12px;
      color: #999999;
      margin-bottom: 10px;
    }

    .post-buttons {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .post-buttons button {
      flex: 1;
      margin-top: 0;
    }

    .preview {
      width: 100%;
      max-height: 250px;
      object-fit: cover;
      display: none;
      margin-top: 10px;
      border-radius: 12px;
    }

    .edit-image {
      display: block;
      width: 100%;
      max-height: 300px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 10px;
    }

    /* 댓글 관리 */

    .comments-admin {
      margin-top: 18px;
      padding-top: 15px;
      border-top: 1px solid #eeeeee;
    }

    .comments-admin-title {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .comment-admin-item {
      padding: 12px;
      margin-top: 8px;
      background: #f8f8f8;
      border-radius: 12px;
    }

    .comment-admin-author {
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .comment-admin-content {
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .comment-admin-date {
      margin-top: 5px;
      color: #999999;
      font-size: 11px;
    }

    .comment-delete {
      background: #fee2e2;
      color: #b91c1c;
      margin-top: 8px;
    }

    .no-comments {
      color: #999999;
      font-size: 13px;
      padding: 5px 0;
    }

    @media (max-width: 600px) {
      .container {
        padding: 12px;
      }

      header {
        padding: 25px 15px;
      }

      header h1 {
        font-size: 27px;
      }
    }
  </style></head><body><header>
  <h1>LEADEAD</h1>
  <p>관리자 페이지</p>
</header><div class="container">  <!-- 로그인 -->  <section id="loginBox" class="card"><h2>관리자 로그인</h2>

<input
  id="email"
  type="email"
  placeholder="이메일"
>

<input
  id="password"
  type="password"
  placeholder="비밀번호"
>

<button class="login" onclick="login()">
  로그인
</button>

<div id="loginStatus" class="status"></div>

  </section>  <!-- 관리자 -->  <section id="adminBox" class="hidden"><!-- 새 게시물 -->

<div class="card">

  <h2>새 게시물 작성</h2>

  <input
    id="title"
    type="text"
    placeholder="제목"
  >

  <textarea
    id="content"
    placeholder="내용"
  ></textarea>

  <input
    id="image"
    type="file"
    accept="image/*"
    onchange="previewImage()"
  >

  <img
    id="imagePreview"
    class="preview"
    alt="미리보기"
  >

  <button
    class="upload"
    onclick="uploadPost()"
  >
    게시물 업로드
  </button>

  <div id="uploadStatus" class="status"></div>

</div>


<!-- 게시물 목록 -->

<div class="card">

  <h2>게시물 목록</h2>

  <button
    class="refresh"
    onclick="loadPosts()"
  >
    🔄 새로고침
  </button>

  <div id="postStatus" class="status"></div>

  <div id="postList"></div>

</div>


<!-- 로그아웃 -->

<div class="card">

  <button
    class="logout"
    onclick="logout()"
  >
    로그아웃
  </button>

</div>

  </section></div><script>

  // ==========================================
  // Supabase
  // ==========================================

  const SUPABASE_URL =
    "https://njmohfznypdcazdhbuul.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_tcRopRjkw1iAPO0r5ty86Q_YZGo-VXq";

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // ==========================================
  // 화면
  // ==========================================

  function showAdmin() {

    document
      .getElementById("loginBox")
      .classList.add("hidden");

    document
      .getElementById("adminBox")
      .classList.remove("hidden");

    loadPosts();

  }


  function showLogin() {

    document
      .getElementById("adminBox")
      .classList.add("hidden");

    document
      .getElementById("loginBox")
      .classList.remove("hidden");

  }


  // ==========================================
  // 로그인
  // ==========================================

  async function login() {

    const email =
      document
        .getElementById("email")
        .value
        .trim();

    const password =
      document
        .getElementById("password")
        .value;

    const status =
      document.getElementById("loginStatus");


    if (!email || !password) {

      status.textContent =
        "이메일과 비밀번호를 입력해줘.";

      return;

    }


    status.textContent =
      "로그인 중...";


    const { error } =
      await supabaseClient.auth.signInWithPassword({

        email: email,
        password: password

      });


    if (error) {

      status.textContent =
        "❌ 로그인 실패: " +
        error.message;

      return;

    }


    status.textContent =
      "✅ 로그인 성공!";

    showAdmin();

  }


  // ==========================================
  // 이미지 미리보기
  // ==========================================

  function previewImage() {

    const file =
      document
        .getElementById("image")
        .files[0];

    const preview =
      document
        .getElementById("imagePreview");


    if (!file) {

      preview.style.display = "none";

      return;

    }


    preview.src =
      URL.createObjectURL(file);

    preview.style.display =
      "block";

  }


  // ==========================================
  // 게시물 업로드
  // ==========================================

  async function uploadPost() {

    const title =
      document
        .getElementById("title")
        .value
        .trim();

    const content =
      document
        .getElementById("content")
        .value
        .trim();

    const file =
      document
        .getElementById("image")
        .files[0];

    const status =
      document
        .getElementById("uploadStatus");


    if (!title) {

      status.textContent =
        "❌ 제목을 입력해줘.";

      return;

    }


    if (!content) {

      status.textContent =
        "❌ 내용을 입력해줘.";

      return;

    }


    status.textContent =
      "업로드 중...";


    let imageUrl = null;


    if (file) {

      const extension =
        file.name
          .split(".")
          .pop();

      const fileName =
        Date.now() +
        "-" +
        Math.random()
          .toString(36)
          .substring(2) +
        "." +
        extension;

      const filePath =
        "posts/" + fileName;


      const {
        error: uploadError
      } =
        await supabaseClient
          .storage
          .from("images")
          .upload(
            filePath,
            file
          );


      if (uploadError) {

        status.textContent =
          "❌ 이미지 업로드 실패: " +
          uploadError.message;

        return;

      }


      const { data } =
        supabaseClient
          .storage
          .from("images")
          .getPublicUrl(filePath);


      imageUrl =
        data.publicUrl;

    }


    const { error } =
      await supabaseClient
        .from("posts")
        .insert({

          title: title,
          content: content,
          image_url: imageUrl

        });


    if (error) {

      status.textContent =
        "❌ 게시물 업로드 실패: " +
        error.message;

      return;

    }


    status.textContent =
      "✅ 게시물이 업로드됐어!";


    document.getElementById("title").value = "";
    document.getElementById("content").value = "";
    document.getElementById("image").value = "";

    document
      .getElementById("imagePreview")
      .style.display = "none";


    loadPosts();

  }


  // ==========================================
  // 게시물 불러오기
  // ==========================================

  async function loadPosts() {

    const list =
      document.getElementById("postList");

    const status =
      document.getElementById("postStatus");


    status.textContent =
      "불러오는 중...";


    const {
      data,
      error
    } =
      await supabaseClient
        .from("posts")
        .select("*")
        .order(
          "created_at",
          {
            ascending: false
          }
        );


    if (error) {

      status.textContent =
        "❌ 불러오기 실패: " +
        error.message;

      return;

    }


    status.textContent =
      data.length +
      "개의 게시물";


    list.innerHTML = "";


    if (data.length === 0) {

      list.innerHTML =
        '<p style="color:#999;">게시물이 아직 없어.</p>';

      return;

    }


    // 게시물

    for (const post of data) {

      const div =
        document.createElement("div");

      div.className =
        "post";


      const author =
        escapeHtml(
          post.author_name || "익명"
        );

      const title =
        escapeHtml(
          post.title || "제목 없음"
        );

      const content =
        escapeHtml(
          post.content || "내용 없음"
        );

      const date =
        post.created_at
          ? new Date(
              post.created_at
            ).toLocaleString(
              "ko-KR"
            )
          : "";


      const imageHTML =
        post.image_url

          ? `
              <img
                src="${escapeAttribute(
                  post.image_url
                )}"
                alt="게시물 이미지"
              >
            `

          : `
              <div class="post-no-image">
                사진 없음
              </div>
            `;


      div.innerHTML = `

        ${imageHTML}

        <div class="post-author">
          👤 ${author}
        </div>

        <div class="post-title">
          ${title}
        </div>

        <div class="post-content">
          ${content}
        </div>

        ${
          date
            ? `
              <div class="post-date">
                ${date}
              </div>
            `
            : ""
        }

        <div class="post-buttons">

          <button
            class="edit"
            onclick="editPost('${post.id}')"
          >
            수정
          </button>

          <button
            class="delete"
            onclick="deletePost('${post.id}')"
          >
            게시물 삭제
          </button>

        </div>

        <div class="comments-admin">

          <div class="comments-admin-title">
            💬 댓글 관리
          </div>

          <div id="admin-comments-${post.id}">
            댓글 불러오는 중...
          </div>

        </div>

      `;


      list.appendChild(div);


      // 해당 게시물 댓글 불러오기

      await loadAdminComments(post.id);

    }

  }


  // ==========================================
  // 관리자 댓글 불러오기
  // ==========================================

  async function loadAdminComments(postId) {

    const container =
      document.getElementById(
        "admin-comments-" + postId
      );


    const {
      data,
      error
    } =
      await supabaseClient
        .from("comments")
        .select("*")
        .eq("post_id", postId)
        .order(
          "created_at",
          {
            ascending: true
          }
        );


    if (error) {

      console.error(error);

      container.innerHTML =
        '<div class="no-comments">댓글을 불러오지 못했어.</div>';

      return;

    }


    if (!data || data.length === 0) {

      container.innerHTML =
        '<div class="no-comments">댓글이 없어.</div>';

      return;

    }


    container.innerHTML = "";


    data.forEach(comment => {

      const item =
        document.createElement("div");

      item.className =
        "comment-admin-item";


      item.innerHTML = `

        <div class="comment-admin-author">
          👤 ${escapeHtml(
            comment.author_name || "익명"
          )}
        </div>

        <div class="comment-admin-content">
          ${escapeHtml(
            comment.content || ""
          )}
        </div>

        <div class="comment-admin-date">
          ${
            comment.created_at
              ? new Date(
                  comment.created_at
                ).toLocaleString(
                  "ko-KR"
                )
              : ""
          }
        </div>

        <button
          class="comment-delete"
          onclick="deleteComment('${comment.id}')"
        >
          🗑️ 댓글 삭제
        </button>

      `;


      container.appendChild(item);

    });

  }


  // ==========================================
  // 댓글 삭제
  // ==========================================

  async function deleteComment(id) {

    const ok =
      confirm(
        "정말 이 댓글을 삭제할까?"
      );


    if (!ok) return;


    const {
      error
    } =
      await supabaseClient
        .from("comments")
        .delete()
        .eq(
          "id",
          id
        );


    if (error) {

      alert(
        "❌ 댓글 삭제 실패\n" +
        error.message
      );

      return;

    }


    alert(
      "✅ 댓글 삭제 완료!"
    );


    loadPosts();

  }


  // ==========================================
  // 게시물 수정
  // ==========================================

  async function editPost(id) {

    const {
      data: post,
      error
    } =
      await supabaseClient
        .from("posts")
        .select("*")
        .eq("id", id)
        .single();


    if (error) {

      alert(
        "수정할 게시물을 불러오지 못했어.\n" +
        error.message
      );

      return;

    }


    const list =
      document.getElementById("postList");

    const cards =
      list.querySelectorAll(".post");


    let target = null;


    cards.forEach(card => {

      const button =
        card.querySelector(".edit");


      if (
        button &&
        button.getAttribute("onclick") ===
        `editPost('${id}')`
      ) {

        target = card;

      }

    });


    if (!target) {

      loadPosts();

      return;

    }


    target.innerHTML = `

      ${
        post.image_url
          ? `
            <img
              class="edit-image"
              src="${escapeAttribute(
                post.image_url
              )}"
              alt="게시물 이미지"
            >
          `
          : ""
      }

      <input
        id="edit-title-${id}"
        value="${escapeAttribute(
          post.title || ""
        )}"
        placeholder="제목"
      >

      <textarea
        id="edit-content-${id}"
        placeholder="내용"
      >${escapeHtml(
        post.content || ""
      )}</textarea>  <button
    class="save"
    onclick="savePost('${id}')"
  >
    저장
  </button>

  <button
    class="cancel"
    onclick="loadPosts()"
  >
    취소
  </button>

`;

}

// ==========================================
// 수정 저장
// ==========================================

async function savePost(id) {

const title =
  document
    .getElementById(
      "edit-title-" + id
    )
    .value
    .trim();

const content =
  document
    .getElementById(
      "edit-content-" + id
    )
    .value
    .trim();


if (!title) {

  alert(
    "제목을 입력해줘."
  );

  return;

}


if (!content) {

  alert(
    "내용을 입력해줘."
  );

  return;

}


const { error } =
  await supabaseClient
    .from("posts")
    .update({

      title: title,
      content: content

    })
    .eq(
      "id",
      id
    );


if (error) {

  alert(
    "❌ 수정 실패\n" +
    error.message
  );

  return;

}


alert(
  "✅ 수정 완료!"
);


loadPosts();

}

// ==========================================
// 게시물 삭제
// ==========================================

async function deletePost(id) {

const ok =
  confirm(
    "정말 이 게시물을 삭제할까?"
  );


if (!ok) return;


const { error } =
  await supabaseClient
    .from("posts")
    .delete()
    .eq(
      "id",
      id
    );


if (error) {

  alert(
    "❌ 삭제 실패\n" +
    error.message
  );

  return;

}


alert(
  "✅ 삭제 완료!"
);


loadPosts();

}

// ==========================================
// 로그아웃
// ==========================================

async function logout() {

await supabaseClient
  .auth
  .signOut();

showLogin();

}

// ==========================================
// HTML 안전 처리
// ==========================================

function escapeHtml(value) {

return String(value ?? "")
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}

function escapeAttribute(value) {

return escapeHtml(value);

}

// ==========================================
// 로그인 상태 확인
// ==========================================

async function checkUser() {

const {
  data: {
    session
  }
} =
  await supabaseClient
    .auth
    .getSession();


if (session) {

  showAdmin();

} else {

  showLogin();

}

}

// ==========================================
// 시작
// ==========================================

checkUser();

</script></body>
</html>
