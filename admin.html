<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LEADEAD 관리자</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f5f5;
      font-family: Arial, sans-serif;
      color: #111;
    }

    header {
      background: #000;
      color: white;
      text-align: center;
      padding: 25px 20px;
    }

    header h1 {
      margin: 0;
      letter-spacing: 3px;
    }

    main {
      max-width: 650px;
      margin: 25px auto;
      padding: 0 16px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
    }

    h2 {
      margin-top: 0;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px;
      margin: 7px 0 16px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }

    textarea {
      min-height: 140px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #000;
      color: white;
      font-size: 16px;
      font-weight: bold;
      margin-top: 5px;
    }

    button:disabled {
      opacity: .5;
    }

    .logout {
      background: #777;
    }

    .hidden {
      display: none;
    }

    #status {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
      line-height: 1.5;
    }

    .info {
      color: #666;
      font-size: 14px;
    }
  </style>
</head>

<body>

<header>
  <h1>LEADEAD</h1>
  <p>관리자 페이지</p>
</header>

<main>

  <!-- 로그인 -->
  <section id="loginBox" class="card">

    <h2>🔐 관리자 로그인</h2>

    <p class="info">
      Supabase에서 만든 관리자 계정으로 로그인하세요.
    </p>

    <label>이메일</label>
    <input
      id="email"
      type="email"
      placeholder="이메일"
      autocomplete="email"
    >

    <label>비밀번호</label>
    <input
      id="password"
      type="password"
      placeholder="비밀번호"
      autocomplete="current-password"
    >

    <button id="loginButton">
      로그인
    </button>

    <div id="loginStatus"></div>

  </section>


  <!-- 관리자 화면 -->
  <section id="adminBox" class="hidden">

    <div class="card">

      <h2>✏️ 새 게시물</h2>

      <label>제목</label>
      <input
        id="title"
        type="text"
        placeholder="제목을 입력하세요"
      >

      <label>내용</label>
      <textarea
        id="content"
        placeholder="내용을 입력하세요"
      ></textarea>

      <label>사진</label>
      <input
        id="image"
        type="file"
        accept="image/*"
      >

      <button id="uploadButton">
        📤 게시물 올리기
      </button>

      <div id="status"></div>

    </div>

    <div class="card">

      <button
        id="logoutButton"
        class="logout"
      >
        로그아웃
      </button>

    </div>

  </section>

</main>


<script>

  // =========================
  // Supabase 연결
  // =========================

  const SUPABASE_URL =
    "https://njmohfznypdcazdhbuul.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_tcRopRjkw1iAPO0r5ty86Q_YZGo-VXq";

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // =========================
  // 화면 전환
  // =========================

  function showAdmin() {
    document
      .getElementById("loginBox")
      .classList.add("hidden");

    document
      .getElementById("adminBox")
      .classList.remove("hidden");
  }


  function showLogin() {
    document
      .getElementById("adminBox")
      .classList.add("hidden");

    document
      .getElementById("loginBox")
      .classList.remove("hidden");
  }


  // =========================
  // 현재 로그인 상태 확인
  // =========================

  async function checkUser() {

    const {
      data: { session }
    } = await supabaseClient.auth.getSession();

    if (session) {
      showAdmin();
    } else {
      showLogin();
    }
  }


  // =========================
  // 로그인
  // =========================

  document
    .getElementById("loginButton")
    .addEventListener("click", async () => {

      const email =
        document
          .getElementById("email")
          .value
          .trim();

      const password =
        document
          .getElementById("password")
          .value;

      const status =
        document
          .getElementById("loginStatus");


      if (!email || !password) {
        status.textContent =
          "이메일과 비밀번호를 입력해줘.";
        return;
      }


      status.textContent =
        "로그인 중...";


      const {
        error
      } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });


      if (error) {

        console.error(error);

        status.textContent =
          "❌ 로그인 실패: " +
          error.message;

        return;
      }


      status.textContent = "";

      showAdmin();

    });


  // =========================
  // 게시물 업로드
  // =========================

  document
    .getElementById("uploadButton")
    .addEventListener("click", uploadPost);


  async function uploadPost() {

    const title =
      document
        .getElementById("title")
        .value
        .trim();

    const content =
      document
        .getElementById("content")
        .value
        .trim();

    const file =
      document
        .getElementById("image")
        .files[0];

    const button =
      document
        .getElementById("uploadButton");

    const status =
      document
        .getElementById("status");


    if (!title) {
      status.textContent =
        "제목을 입력해줘.";
      return;
    }

    if (!content) {
      status.textContent =
        "내용을 입력해줘.";
      return;
    }


    button.disabled = true;
    status.textContent =
      "업로드 중...";


    try {

      let imageUrl = null;


      // -------------------------
      // 사진 업로드
      // -------------------------

      if (file) {

        const safeName =
          file.name.replace(
            /[^a-zA-Z0-9._-]/g,
            "_"
          );

        const fileName =
          Date.now() +
          "-" +
          safeName;


        const {
          error: uploadError
        } =
          await supabaseClient
            .storage
            .from("images")
            .upload(
              fileName,
              file
            );


        if (uploadError) {
          throw uploadError;
        }


        const {
          data
        } =
          supabaseClient
            .storage
            .from("images")
            .getPublicUrl(fileName);


        imageUrl =
          data.publicUrl;
      }


      // -------------------------
      // 게시물 DB 저장
      // -------------------------

      const {
        error: insertError
      } =
        await supabaseClient
          .from("posts")
          .insert({
            title: title,
            content: content,
            image_url: imageUrl
          });


      if (insertError) {
        throw insertError;
      }


      status.textContent =
        "🎉 게시물이 올라갔어!";


      document
        .getElementById("title")
        .value = "";

      document
        .getElementById("content")
        .value = "";

      document
        .getElementById("image")
        .value = "";


    } catch (error) {

      console.error(error);

      status.textContent =
        "❌ 업로드 실패: " +
        error.message;

    } finally {

      button.disabled = false;

    }
  }


  // =========================
  // 로그아웃
  // =========================

  document
    .getElementById("logoutButton")
    .addEventListener("click", async () => {

      await supabaseClient.auth.signOut();

      showLogin();

    });


  // 시작
  checkUser();

</script>

</body>
</html>
