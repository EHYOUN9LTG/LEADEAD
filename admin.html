<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LEADEAD 관리자</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: #0b0b0d;
    color: #f5f5f5;
    font-family: Arial, sans-serif;
  }

  header {
    background: linear-gradient(135deg, #000, #18181c);
    color: white;
    text-align: center;
    padding: 35px 20px;
    border-bottom: 1px solid #29292e;
  }

  header h1 {
    margin: 0;
    font-size: 32px;
    letter-spacing: 5px;
  }

  header p {
    margin: 8px 0 0;
    color: #999;
  }

  main {
    max-width: 700px;
    margin: 30px auto;
    padding: 0 16px;
  }

  .card {
    background: #151518;
    border: 1px solid #29292e;
    padding: 22px;
    border-radius: 18px;
    margin-bottom: 20px;
    box-shadow: 0 8px 30px rgba(0,0,0,.25);
  }

  h2 {
    margin-top: 0;
    font-size: 21px;
  }

  label {
    display: block;
    margin-bottom: 6px;
    font-size: 14px;
    color: #bbb;
  }

  input,
  textarea {
    width: 100%;
    padding: 14px;
    margin: 6px 0 17px;
    border: 1px solid #333;
    border-radius: 12px;
    background: #0d0d0f;
    color: white;
    font-size: 16px;
    outline: none;
  }

  input:focus,
  textarea:focus {
    border-color: #777;
  }

  textarea {
    min-height: 140px;
    resize: vertical;
  }

  input[type="file"] {
    padding: 11px;
  }

  button {
    width: 100%;
    padding: 14px;
    border: 0;
    border-radius: 12px;
    background: white;
    color: black;
    font-size: 16px;
    font-weight: bold;
    margin-top: 6px;
    cursor: pointer;
    transition: .2s;
  }

  button:hover {
    transform: translateY(-1px);
    opacity: .9;
  }

  button:disabled {
    opacity: .5;
  }

  .logout {
    background: #29292e;
    color: white;
  }

  .delete {
    background: #b91c1c;
    color: white;
    margin-top: 10px;
  }

  .edit {
    background: #303036;
    color: white;
    margin-top: 10px;
  }

  .save {
    background: #16a34a;
    color: white;
  }

  .cancel {
    background: #555;
    color: white;
  }

  .refresh {
    background: #29292e;
    color: white;
    margin-bottom: 15px;
  }

  .hidden {
    display: none;
  }

  #status,
  #loginStatus,
  #postStatus {
    text-align: center;
    margin-top: 15px;
    font-weight: bold;
    line-height: 1.5;
  }

  .info {
    color: #888;
    font-size: 14px;
  }

  .post {
    background: #0d0d0f;
    border: 1px solid #29292e;
    border-radius: 16px;
    padding: 17px;
    margin-bottom: 15px;
  }

  .post h3 {
    margin: 0 0 10px;
    font-size: 19px;
  }

  .post p {
    white-space: pre-wrap;
    line-height: 1.6;
    color: #ccc;
  }

  .post img {
    width: 100%;
    max-height: 350px;
    object-fit: cover;
    border-radius: 12px;
    margin-top: 10px;
  }

  .date {
    color: #666;
    font-size: 12px;
    margin-top: 10px;
  }

  .empty {
    text-align: center;
    color: #777;
    padding: 25px 0;
  }

  .edit-label {
    display: block;
    font-weight: bold;
    margin-top: 5px;
  }
  </style>
</head>

<body>

<header>
  <h1>LEADEAD</h1>
  <p>관리자 페이지</p>
</header>

<main>

  <!-- 로그인 -->
  <section id="loginBox" class="card">

    <h2>🔐 관리자 로그인</h2>

    <p class="info">
      Supabase에서 만든 관리자 계정으로 로그인하세요.
    </p>

    <label>이메일</label>

    <input
      id="email"
      type="email"
      placeholder="이메일"
      autocomplete="email"
    >

    <label>비밀번호</label>

    <input
      id="password"
      type="password"
      placeholder="비밀번호"
      autocomplete="current-password"
    >

    <button id="loginButton">
      로그인
    </button>

    <div id="loginStatus"></div>

  </section>


  <!-- 관리자 화면 -->
  <section id="adminBox" class="hidden">

    <!-- 새 게시물 -->
    <div class="card">

      <h2>✏️ 새 게시물</h2>

      <label>제목</label>

      <input
        id="title"
        type="text"
        placeholder="제목을 입력하세요"
      >

      <label>내용</label>

      <textarea
        id="content"
        placeholder="내용을 입력하세요"
      ></textarea>

      <label>사진</label>

      <input
        id="image"
        type="file"
        accept="image/*"
      >

      <button id="uploadButton">
        📤 게시물 올리기
      </button>

      <div id="status"></div>

    </div>


    <!-- 게시물 관리 -->
    <div class="card">

      <h2>📋 게시물 관리</h2>

      <button
        id="refreshButton"
        class="refresh"
      >
        🔄 게시물 새로고침
      </button>

      <div id="postStatus"></div>

      <div id="postList"></div>

    </div>


    <!-- 로그아웃 -->
    <div class="card">

      <button
        id="logoutButton"
        class="logout"
      >
        로그아웃
      </button>

    </div>

  </section>

</main>


<script>

  // =========================
  // Supabase 연결
  // =========================

  const SUPABASE_URL =
    "https://njmohfznypdcazdhbuul.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_tcRopRjkw1iAPO0r5ty86Q_YZGo-VXq";

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // =========================
  // 화면 전환
  // =========================

  function showAdmin() {

    document
      .getElementById("loginBox")
      .classList.add("hidden");

    document
      .getElementById("adminBox")
      .classList.remove("hidden");

    loadPosts();
  }


  function showLogin() {

    document
      .getElementById("adminBox")
      .classList.add("hidden");

    document
      .getElementById("loginBox")
      .classList.remove("hidden");
  }


  // =========================
  // 현재 로그인 상태 확인
  // =========================

  async function checkUser() {

    const {
      data: { session }
    } = await supabaseClient.auth.getSession();

    if (session) {
      showAdmin();
    } else {
      showLogin();
    }
  }


  // =========================
  // 로그인
  // =========================

  document
    .getElementById("loginButton")
    .addEventListener("click", async () => {

      const email =
        document
          .getElementById("email")
          .value
          .trim();

      const password =
        document
          .getElementById("password")
          .value;

      const status =
        document
          .getElementById("loginStatus");


      if (!email || !password) {

        status.textContent =
          "이메일과 비밀번호를 입력해줘.";

        return;
      }


      status.textContent =
        "로그인 중...";


      const {
        error
      } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });


      if (error) {

        console.error(error);

        status.textContent =
          "❌ 로그인 실패: " +
          error.message;

        return;
      }


      status.textContent = "";

      showAdmin();

    });


  // =========================
  // 게시물 업로드
  // =========================

  document
    .getElementById("uploadButton")
    .addEventListener("click", uploadPost);


  async function uploadPost() {

    const title =
      document
        .getElementById("title")
        .value
        .trim();

    const content =
      document
        .getElementById("content")
        .value
        .trim();

    const file =
      document
        .getElementById("image")
        .files[0];

    const button =
      document
        .getElementById("uploadButton");

    const status =
      document
        .getElementById("status");


    if (!title) {

      status.textContent =
        "제목을 입력해줘.";

      return;
    }


    if (!content) {

      status.textContent =
        "내용을 입력해줘.";

      return;
    }


    button.disabled = true;

    status.textContent =
      "업로드 중...";


    try {

      let imageUrl = null;


      // 사진 업로드
      if (file) {

        const safeName =
          file.name.replace(
            /[^a-zA-Z0-9._-]/g,
            "_"
          );

        const fileName =
          Date.now() +
          "-" +
          safeName;


        const {
          error: uploadError
        } =
          await supabaseClient
            .storage
            .from("images")
            .upload(
              fileName,
              file
            );


        if (uploadError) {
          throw uploadError;
        }


        const {
          data
        } =
          supabaseClient
            .storage
            .from("images")
            .getPublicUrl(fileName);


        imageUrl =
          data.publicUrl;
      }


      // DB 저장
      const {
        error: insertError
      } =
        await supabaseClient
          .from("posts")
          .insert({
            title: title,
            content: content,
            image_url: imageUrl
          });


      if (insertError) {
        throw insertError;
      }


      status.textContent =
        "🎉 게시물이 올라갔어!";


      document
        .getElementById("title")
        .value = "";

      document
        .getElementById("content")
        .value = "";

      document
        .getElementById("image")
        .value = "";


      loadPosts();


    } catch (error) {

      console.error(error);

      status.textContent =
        "❌ 업로드 실패: " +
        error.message;

    } finally {

      button.disabled = false;

    }
  }


  // =========================
  // 게시물 불러오기
  // =========================

  async function loadPosts() {

    const list =
      document
        .getElementById("postList");

    const status =
      document
        .getElementById("postStatus");


    status.textContent =
      "게시물 불러오는 중...";


    const {
      data,
      error
    } =
      await supabaseClient
        .from("posts")
        .select("*")
        .order("created_at", {
          ascending: false
        });


    if (error) {

      console.error(error);

      status.textContent =
        "❌ 불러오기 실패: " +
        error.message;

      return;
    }


    status.textContent = "";

    list.innerHTML = "";


    if (!data || data.length === 0) {

      list.innerHTML =
        '<div class="empty">게시물이 아직 없어.</div>';

      return;
    }


    data.forEach(post => {

      const div =
        document.createElement("div");

      div.className = "post";

      div.dataset.id = post.id;


      let html = "";

      html +=
        "<h3>" +
        escapeHtml(post.title) +
        "</h3>";


      html +=
        "<p>" +
        escapeHtml(post.content) +
        "</p>";


      if (post.image_url) {

        html +=
          '<img src="' +
          post.image_url +
          '" alt="게시물 이미지">';
      }


      if (post.created_at) {

        html +=
          '<div class="date">' +
          new Date(post.created_at).toLocaleString("ko-KR") +
          "</div>";
      }


      // 수정 버튼
      html +=
        '<button class="edit" onclick="editPost(\'' +
        post.id +
        '\')">' +
        "✏️ 수정" +
        "</button>";


      // 삭제 버튼
      html +=
        '<button class="delete" onclick="deletePost(\'' +
        post.id +
        '\')">' +
        "🗑️ 이 게시물 삭제" +
        "</button>";


      div.innerHTML = html;

      list.appendChild(div);

    });

  }


  // =========================
  // 게시물 수정 화면
  // =========================

  async function editPost(id) {

    const {
      data: post,
      error
    } =
      await supabaseClient
        .from("posts")
        .select("*")
        .eq("id", id)
        .single();


    if (error) {

      console.error(error);

      document
        .getElementById("postStatus")
        .textContent =
          "❌ 게시물 불러오기 실패: " +
          error.message;

      return;
    }


    const card =
      document.querySelector(
        '.post[data-id="' + id + '"]'
      );


    if (!card) {
      return;
    }


    let html = "";


    // 기존 사진은 그대로 보여줌
    if (post.image_url) {

      html +=
        '<img src="' +
        post.image_url +
        '" alt="게시물 이미지">';
    }


    html +=
      '<label class="edit-label">제목</label>';


    html +=
      '<input id="edit-title-' +
      id +
      '" type="text" value="' +
      escapeAttribute(post.title) +
      '">';


    html +=
      '<label class="edit-label">내용</label>';


    html +=
      '<textarea id="edit-content-' +
      id +
      '">' +
      escapeHtml(post.content) +
      "</textarea>";


    html +=
      '<button class="save" onclick="savePost(\'' +
      id +
      '\')">' +
      "💾 저장" +
      "</button>";


    html +=
      '<button class="cancel" onclick="loadPosts()">' +
      "↩️ 취소" +
      "</button>";


    card.innerHTML = html;

  }


  // =========================
  // 게시물 수정 저장
  // =========================

  async function savePost(id) {

    const titleInput =
      document.getElementById(
        "edit-title-" + id
      );

    const contentInput =
      document.getElementById(
        "edit-content-" + id
      );


    if (!titleInput || !contentInput) {
      return;
    }


    const title =
      titleInput.value.trim();

    const content =
      contentInput.value.trim();


    const status =
      document.getElementById(
        "postStatus"
      );


    if (!title) {

      status.textContent =
        "제목을 입력해줘.";

      return;
    }


    if (!content) {

      status.textContent =
        "내용을 입력해줘.";

      return;
    }


    status.textContent =
      "수정 저장 중...";


    const {
      error
    } =
      await supabaseClient
        .from("posts")
        .update({
          title: title,
          content: content
        })
        .eq("id", id);


    if (error) {

      console.error(error);

      status.textContent =
        "❌ 수정 실패: " +
        error.message;

      return;
    }


    status.textContent =
      "✏️ 수정 완료!";


    loadPosts();

  }


  // =========================
  // 게시물 삭제
  // =========================

  async function deletePost(id) {

    const confirmed =
      confirm(
        "정말 이 게시물을 삭제할까?"
      );


    if (!confirmed) {
      return;
    }


    const status =
      document
        .getElementById("postStatus");


    status.textContent =
      "삭제 중...";


    const {
      error
    } =
      await supabaseClient
        .from("posts")
        .delete()
        .eq("id", id);


    if (error) {

      console.error(error);

      status.textContent =
        "❌ 삭제 실패: " +
        error.message;

      return;
    }


    status.textContent =
      "🗑️ 삭제 완료!";


    loadPosts();

  }


  // =========================
  // 새로고침
  // =========================

  document
    .getElementById("refreshButton")
    .addEventListener(
      "click",
      loadPosts
    );


  // =========================
  // 로그아웃
  // =========================

  document
    .getElementById("logoutButton")
    .addEventListener("click", async () => {

      await supabaseClient.auth.signOut();

      showLogin();

    });


  // =========================
  // HTML 문자 보호
  // =========================

  function escapeHtml(text) {

    if (text === null || text === undefined) {
      return "";
    }

    return String(text)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  function escapeAttribute(text) {

    if (text === null || text === undefined) {
      return "";
    }

    return String(text)
      .replace(/&/g, "&amp;")
      .replace(/"/g, "&quot;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/'/g, "&#039;");
  }


  // =========================
  // 시작
  // =========================

  checkUser();

</script>

</body>
</html>
