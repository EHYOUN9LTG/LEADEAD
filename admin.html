<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LEADEAD 관리자</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: white;

      background-color: #0b0b0d;
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;

      transition: background-image 0.5s ease;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.38);
      z-index: -1;
    }

    header {
      padding: 30px 20px;
      text-align: center;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(255,255,255,0.12);
    }

    header h1 {
      margin: 0;
      font-size: 32px;
      letter-spacing: 2px;
    }

    header p {
      margin: 8px 0 0;
      color: #bbb;
    }

    .container {
      width: 100%;
      max-width: 800px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: rgba(20, 20, 24, 0.88);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
      backdrop-filter: blur(10px);
    }

    h2 {
      margin-top: 0;
    }

    input,
    textarea {
      width: 100%;
      padding: 14px;
      margin: 7px 0;
      border: 1px solid #333;
      border-radius: 12px;
      background: #111115;
      color: white;
      font-size: 15px;
      outline: none;
    }

    input:focus,
    textarea:focus {
      border-color: #777;
    }

    textarea {
      min-height: 150px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 8px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .login {
      background: white;
      color: black;
    }

    .upload {
      background: white;
      color: black;
    }

    .refresh {
      background: #333;
      color: white;
    }

    .edit {
      background: #292929;
      color: white;
    }

    .save {
      background: #16a34a;
      color: white;
    }

    .cancel {
      background: #555;
      color: white;
    }

    .delete {
      background: #dc2626;
      color: white;
    }

    .logout {
      background: #555;
      color: white;
    }

    button:active {
      transform: scale(0.98);
    }

    .hidden {
      display: none;
    }

    .status {
      margin-top: 12px;
      padding: 12px;
      border-radius: 10px;
      background: rgba(255,255,255,0.07);
      color: #ddd;
      word-break: break-word;
    }

    .post {
      background: rgba(10,10,12,0.8);
      border: 1px solid #292929;
      border-radius: 15px;
      padding: 15px;
      margin-top: 15px;
    }

    .post img {
      width: 100%;
      max-height: 300px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 12px;
    }

    .post h3 {
      margin: 5px 0 8px;
    }

    .post p {
      color: #ccc;
      white-space: pre-wrap;
      line-height: 1.5;
    }

    .date {
      font-size: 12px;
      color: #888;
      margin-bottom: 10px;
    }

    .row-buttons {
      display: flex;
      gap: 8px;
    }

    .row-buttons button {
      flex: 1;
    }

    .preview {
      max-width: 100%;
      max-height: 250px;
      display: none;
      margin-top: 10px;
      border-radius: 12px;
    }

    @media (max-width: 600px) {
      .container {
        padding: 12px;
      }

      header {
        padding: 25px 15px;
      }

      header h1 {
        font-size: 27px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>LEADEAD</h1>
  <p>관리자 페이지</p>
</header>

<div class="container">

  <!-- 로그인 -->
  <section id="loginBox" class="card">

    <h2>관리자 로그인</h2>

    <input
      id="email"
      type="email"
      placeholder="이메일"
    >

    <input
      id="password"
      type="password"
      placeholder="비밀번호"
    >

    <button class="login" onclick="login()">
      로그인
    </button>

    <div id="loginStatus" class="status"></div>

  </section>


  <!-- 관리자 -->
  <section id="adminBox" class="hidden">

    <!-- 새 글 -->
    <div class="card">

      <h2>새 게시물 작성</h2>

      <input
        id="title"
        type="text"
        placeholder="제목"
      >

      <textarea
        id="content"
        placeholder="내용"
      ></textarea>

      <input
        id="image"
        type="file"
        accept="image/*"
        onchange="previewImage()"
      >

      <img
        id="imagePreview"
        class="preview"
      >

      <button class="upload" onclick="uploadPost()">
        게시물 업로드
      </button>

      <div id="uploadStatus" class="status"></div>

    </div>


    <!-- 게시물 관리 -->
    <div class="card">

      <h2>게시물 관리</h2>

      <button class="refresh" onclick="loadPosts()">
        🔄 새로고침
      </button>

      <div id="postStatus" class="status"></div>

      <div id="postList"></div>

    </div>


    <!-- 로그아웃 -->
    <div class="card">

      <button class="logout" onclick="logout()">
        로그아웃
      </button>

    </div>

  </section>

</div>


<script>

  // ==========================================
  // Supabase
  // ==========================================

  const SUPABASE_URL =
    "https://njmohfznypdcazdhbuul.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_tcRopRjkw1iAPO0r5ty86Q_YZGo-VXq";

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // ==========================================
  // 랜덤 배경
  // ==========================================

  const backgroundGroups = {

    stellive: [
      "KANNA.webp",
      "HEBI.webp",
      "HUYA.webp",
      "LIZE.webp",
      "TABI.webp",
      "MASHIRO.webp",
      "HINA.webp",
      "BUKI.webp",
      "LIN.webp",
      "NANA.webp",
      "RIKO.webp",
      "YUNI.jpeg"
    ],

    isegye: [
      "GOSEGU.webp",
      "JURURU.webp",
      "VICHAN.webp",
      "INE.webp",
      "JINGBURGUR.webp",
      "LILPA.webp",
      "ISEGYE IDOL.png"
    ],

    lotte: [
      "LOTTE.jpeg",
      "LOTTE1.jpeg",
      "LOTTE2.jpeg"
    ]

  };


  function setRandomBackground() {

    const groups =
      Object.values(backgroundGroups);

    const selectedGroup =
      groups[
        Math.floor(
          Math.random() * groups.length
        )
      ];

    const selectedImage =
      selectedGroup[
        Math.floor(
          Math.random() * selectedGroup.length
        )
      ];

    const imagePath =
      "assets/background/" +
      encodeURIComponent(selectedImage);

    document.body.style.backgroundImage =
      `url("${imagePath}")`;

  }


  // 페이지 열릴 때 랜덤 배경
  setRandomBackground();


  // ==========================================
  // 화면 전환
  // ==========================================

  function showAdmin() {

    document
      .getElementById("loginBox")
      .classList.add("hidden");

    document
      .getElementById("adminBox")
      .classList.remove("hidden");

    loadPosts();

  }


  function showLogin() {

    document
      .getElementById("adminBox")
      .classList.add("hidden");

    document
      .getElementById("loginBox")
      .classList.remove("hidden");

  }


  // ==========================================
  // 로그인
  // ==========================================

  async function login() {

    const email =
      document
        .getElementById("email")
        .value
        .trim();

    const password =
      document
        .getElementById("password")
        .value;

    const status =
      document.getElementById("loginStatus");

    if (!email || !password) {

      status.textContent =
        "이메일과 비밀번호를 입력해줘.";

      return;

    }

    status.textContent =
      "로그인 중...";


    const { data, error } =
      await supabaseClient.auth.signInWithPassword({

        email: email,
        password: password

      });


    if (error) {

      status.textContent =
        "❌ 로그인 실패: " +
        error.message;

      return;

    }


    status.textContent =
      "✅ 로그인 성공!";

    showAdmin();

  }


  // ==========================================
  // 이미지 미리보기
  // ==========================================

  function previewImage() {

    const file =
      document.getElementById("image")
        .files[0];

    const preview =
      document.getElementById("imagePreview");


    if (!file) {

      preview.style.display = "none";

      return;

    }


    const url =
      URL.createObjectURL(file);

    preview.src = url;
    preview.style.display = "block";

  }


  // ==========================================
  // 게시물 업로드
  // ==========================================

  async function uploadPost() {

    const title =
      document
        .getElementById("title")
        .value
        .trim();

    const content =
      document
        .getElementById("content")
        .value
        .trim();

    const file =
      document
        .getElementById("image")
        .files[0];

    const status =
      document.getElementById("uploadStatus");


    if (!title) {

      status.textContent =
        "❌ 제목을 입력해줘.";

      return;

    }


    if (!content) {

      status.textContent =
        "❌ 내용을 입력해줘.";

      return;

    }


    status.textContent =
      "업로드 중...";


    let imageUrl = null;


    // 이미지가 있으면 Storage 업로드
    if (file) {

      const extension =
        file.name
          .split(".")
          .pop();

      const fileName =
        Date.now() +
        "-" +
        Math.random()
          .toString(36)
          .substring(2) +
        "." +
        extension;


      const filePath =
        "posts/" + fileName;


      const { error: uploadError } =
        await supabaseClient
          .storage
          .from("images")
          .upload(
            filePath,
            file
          );


      if (uploadError) {

        status.textContent =
          "❌ 이미지 업로드 실패: " +
          uploadError.message;

        return;

      }


      const { data } =
        supabaseClient
          .storage
          .from("images")
          .getPublicUrl(filePath);


      imageUrl =
        data.publicUrl;

    }


    // 게시물 DB 저장
    const { error } =
      await supabaseClient
        .from("posts")
        .insert({

          title: title,
          content: content,
          image_url: imageUrl

        });


    if (error) {

      status.textContent =
        "❌ 게시물 업로드 실패: " +
        error.message;

      return;

    }


    status.textContent =
      "✅ 게시물이 업로드됐어!";


    // 입력 초기화
    document
      .getElementById("title")
      .value = "";

    document
      .getElementById("content")
      .value = "";

    document
      .getElementById("image")
      .value = "";

    document
      .getElementById("imagePreview")
      .style.display = "none";


    loadPosts();

  }


  // ==========================================
  // 게시물 불러오기
  // ==========================================

  async function loadPosts() {

    const list =
      document.getElementById("postList");

    const status =
      document.getElementById("postStatus");


    status.textContent =
      "게시물 불러오는 중...";


    const { data, error } =
      await supabaseClient
        .from("posts")
        .select("*")
        .order(
          "created_at",
          {
            ascending: false
          }
        );


    if (error) {

      status.textContent =
        "❌ 불러오기 실패: " +
        error.message;

      return;

    }


    status.textContent =
      data.length +
      "개의 게시물";


    list.innerHTML = "";


    if (data.length === 0) {

      list.innerHTML =
        "<p>게시물이 아직 없어.</p>";

      return;

    }


    data.forEach(post => {

      const div =
        document.createElement("div");

      div.className = "post";

      const image =
        post.image_url
          ? `
            <img
              src="${escapeAttribute(post.image_url)}"
              alt=""
            >
          `
          : "";


      const date =
        post.created_at
          ? new Date(
              post.created_at
            ).toLocaleString(
              "ko-KR"
            )
          : "";


      div.innerHTML = `

        ${image}

        <div class="date">
          ${escapeHtml(date)}
        </div>

        <h3>
          ${escapeHtml(post.title)}
        </h3>

        <p>
          ${escapeHtml(post.content)}
        </p>

        <div class="row-buttons">

          <button
            class="edit"
            onclick="editPost('${post.id}')"
          >
            수정
          </button>

          <button
            class="delete"
            onclick="deletePost('${post.id}')"
          >
            삭제
          </button>

        </div>

      `;


      list.appendChild(div);

    });

  }


  // ==========================================
  // 게시물 수정
  // ==========================================

  async function editPost(id) {

    const { data: post, error } =
      await supabaseClient
        .from("posts")
        .select("*")
        .eq("id", id)
        .single();


    if (error) {

      alert(
        "수정할 게시물을 불러오지 못했어.\n" +
        error.message
      );

      return;

    }


    const list =
      document.getElementById("postList");

    const cards =
      list.querySelectorAll(".post");


    let target = null;


    cards.forEach(card => {

      const button =
        card.querySelector(".edit");

      if (
        button &&
        button.getAttribute("onclick") ===
        `editPost('${id}')`
      ) {

        target = card;

      }

    });


    if (!target) {

      loadPosts();

      return;

    }


    target.innerHTML = `

      ${
        post.image_url
          ? `
            <img
              src="${escapeAttribute(post.image_url)}"
              alt=""
            >
          `
          : ""
      }

      <input
        id="edit-title-${id}"
        value="${escapeAttribute(post.title || "")}"
        placeholder="제목"
      >

      <textarea
        id="edit-content-${id}"
        placeholder="내용"
      >${escapeHtml(post.content || "")}</textarea>

      <button
        class="save"
        onclick="savePost('${id}')"
      >
        저장
      </button>

      <button
        class="cancel"
        onclick="loadPosts()"
      >
        취소
      </button>

    `;

  }


  // ==========================================
  // 수정 저장
  // ==========================================

  async function savePost(id) {

    const title =
      document
        .getElementById(
          "edit-title-" + id
        )
        .value
        .trim();

    const content =
      document
        .getElementById(
          "edit-content-" + id
        )
        .value
        .trim();


    if (!title) {

      alert("제목을 입력해줘.");

      return;

    }


    if (!content) {

      alert("내용을 입력해줘.");

      return;

    }


    const { error } =
      await supabaseClient
        .from("posts")
        .update({

          title: title,
          content: content

        })
        .eq(
          "id",
          id
        );


    if (error) {

      alert(
        "❌ 수정 실패\n" +
        error.message
      );

      return;

    }


    alert("✅ 수정 완료!");

    loadPosts();

  }


  // ==========================================
  // 게시물 삭제
  // ==========================================

  async function deletePost(id) {

    const ok =
      confirm(
        "정말 이 게시물을 삭제할까?"
      );


    if (!ok) return;


    const { error } =
      await supabaseClient
        .from("posts")
        .delete()
        .eq(
          "id",
          id
        );


    if (error) {

      alert(
        "❌ 삭제 실패\n" +
        error.message
      );

      return;

    }


    alert("✅ 삭제 완료!");

    loadPosts();

  }


  // ==========================================
  // 로그아웃
  // ==========================================

  async function logout() {

    await supabaseClient.auth.signOut();

    showLogin();

  }


  // ==========================================
  // HTML 문자 안전 처리
  // ==========================================

  function escapeHtml(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  function escapeAttribute(value) {

    return escapeHtml(value);

  }


  // ==========================================
  // 로그인 상태 확인
  // ==========================================

  async function checkUser() {

    const {
      data: {
        session
      }
    } =
      await supabaseClient
        .auth
        .getSession();


    if (session) {

      showAdmin();

    } else {

      showLogin();

    }

  }


  // 시작
  checkUser();

</script>

</body>
</html>
